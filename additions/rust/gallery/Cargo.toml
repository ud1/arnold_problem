[package]
name = "kobon-solutions"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
leptos-use = "0.19.0"
web-sys = { version = "0.3.103", features = [
    "TouchEvent",
    "Touch",
    "TouchList",
    "SvgElement",
    "DomRect",
    "EventTarget",
    "BlobPropertyBag",
] }
wasm-bindgen = "0.2.126"
serde = { version = "1.0.229", features = ["derive"] }
gloo-net = "0.6.0"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.103"

[build]
public_url = "./gallery"
